<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件名优化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f5f5f7;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            color: #1d1d1f;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        .flex-container {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
        }

        .column {
            flex: 1;
            min-width: 0;
        }

        .textarea-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .textarea-label {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .count-label {
            font-size: 12px;
            color: #86868b;
        }

        textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.4;
            background: #ffffff;
        }

        textarea:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0,102,204,0.1);
        }

        .log-section {
            margin-top: 20px;
            border-top: 1px solid #d2d2d7;
            padding-top: 20px;
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .log-title {
            font-size: 16px;
            color: #1d1d1f;
            font-weight: 500;
        }

        .log-area {
            height: 200px;
            background: #fafafa;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            padding: 12px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
            font-family: menlo, monospace;
        }

        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #eee;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .original {
            color: #ff3b30;
            text-decoration: line-through;
        }

        .log-entry .arrow {
            color: #86868b;
            margin: 0 8px;
        }

        .log-entry .modified {
            color: #34c759;
        }

        .button-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: #0051a3;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.clear {
            background: #ff3b30;
        }

        button.clear:hover {
            background: #d70015;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin: 16px 0;
        }

        .stat {
            background: #f5f5f7;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: #1d1d1f;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stat-value {
            font-weight: 600;
            color: #0066cc;
        }

        @media (max-width: 768px) {
            .flex-container {
                flex-direction: column;
            }
            
            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .stats-container {
                flex-direction: column;
                align-items: center;
            }
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 1000;
            animation: fadeInOut 1.5s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>文件名优化工具</h1>
        
        <div class="flex-container">
            <div class="column">
                <div class="textarea-wrapper">
                    <div class="textarea-label">
                        原始标题
                        <span class="count-label" id="inputCount">0 行</span>
                    </div>
                    <textarea id="input" placeholder="请在此处粘贴需要处理的标题，每行一个标题"></textarea>
                </div>
            </div>
            <div class="column">
                <div class="textarea-wrapper">
                    <div class="textarea-label">
                        优化后的标题
                        <span class="count-label" id="outputCount">0 行</span>
                    </div>
                    <textarea id="output" placeholder="此处显示优化后的结果" readonly></textarea>
                </div>
            </div>
        </div>

        <div class="button-group">
            <button onclick="processAll()">一键优化</button>
            <button onclick="copyResult()">复制结果</button>
            <button class="clear" onclick="clearAll()">清空内容</button>
        </div>

        <div class="stats-container">
            <span class="stat">总数：<span id="totalCount" class="stat-value">0</span></span>
            <span class="stat">重复数：<span id="duplicateCount" class="stat-value">0</span></span>
            <span class="stat">优化数：<span id="modifiedCount" class="stat-value">0</span></span>
        </div>

        <div class="log-section">
            <div class="log-header">
                <span class="log-title">优化日志</span>
            </div>
            <div id="log" class="log-area"></div>
        </div>
    </div>

    <script>
        class FilenameOptimizer {
            constructor() {
                this.invalidChars = /[<>:"/\\|?*\x00-\x1F]/g;
                this.maxLength = 255;
                this.logs = [];
            }

            optimize(filename) {
                const original = filename;
                let modified = filename;
                const changes = [];

                // 移除无效字符
                const invalidCharsFound = modified.match(this.invalidChars);
                if (invalidCharsFound) {
                    changes.push(`移除无效字符: ${invalidCharsFound.join(', ')}`);
                    modified = modified.replace(this.invalidChars, '');
                }

                // 处理多余的空格和标点
                const oldModified = modified;
                modified = modified
                    .replace(/\s+/g, ' ')  // 多个空格替换为单个
                    .replace(/[,，]{2,}/g, '，') // 多个逗号替换为单个
                    .replace(/[.。]{2,}/g, '。') // 多个句号替换为单个
                    .replace(/^\s+|\s+$/g, ''); // 移除首尾空格

                if (oldModified !== modified) {
                    changes.push('优化空格和标点');
                }

                // 处理文件名长度
                if (modified.length > this.maxLength) {
                    changes.push(`截断超长文件名(${modified.length} -> ${this.maxLength})`);
                    modified = modified.substring(0, this.maxLength);
                }

                // 处理以点或空格结尾的情况
                const oldEnding = modified;
                modified = modified.replace(/[. 。，,]+$/, '');
                if (oldEnding !== modified) {
                    changes.push('移除末尾的点号或空格');
                }

                // 记录日志
                if (original !== modified) {
                    this.logs.push({
                        original,
                        modified,
                        changes
                    });
                }

                return modified;
            }

            getStats() {
                return {
                    modifiedCount: this.logs.length
                };
            }

            getLogs() {
                return this.logs;
            }

            clearLogs() {
                this.logs = [];
            }
        }

        const optimizer = new FilenameOptimizer();

        function processAll() {
            const input = document.getElementById('input');
            const output = document.getElementById('output');
            const lines = input.value.trim().split('\n').filter(line => line.trim());
            
            // 清除之前的日志
            optimizer.clearLogs();
            
            // 去重并优化
            const seen = new Set();
            const duplicates = new Set();
            const processedLines = [];

            lines.forEach(line => {
                const optimized = optimizer.optimize(line);
                if (seen.has(optimized)) {
                    duplicates.add(optimized);
                } else {
                    seen.add(optimized);
                    processedLines.push(optimized);
                }
            });

            // 更新输出
            output.value = processedLines.join('\n');
            
            // 更新行数计数
            updateLineCounts();

            // 更新日志
            updateLog();
            
            // 更新统计
            updateStats(processedLines.length, duplicates.size, optimizer.getStats().modifiedCount);
        }

        function updateLog() {
            const logArea = document.getElementById('log');
            logArea.innerHTML = optimizer.getLogs().map(log => `
                <div class="log-entry">
                    <span class="original">${log.original}</span>
                    <span class="arrow">→</span>
                    <span class="modified">${log.modified}</span>
                    <div style="color: #86868b; font-size: 12px; margin-top: 4px;">
                        ${log.changes.join(' | ')}
                    </div>
                </div>
            `).join('');
        }

        function copyResult() {
            const output = document.getElementById('output');
            navigator.clipboard.writeText(output.value).then(() => {
                showToast('已复制到剪贴板');
            }).catch(() => {
                output.select();
                document.execCommand('copy');
                showToast('已复制到剪贴板');
            });
        }

        function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('log').innerHTML = '';
            optimizer.clearLogs();
            updateStats(0, 0, 0);
            updateLineCounts();
        }

        function updateStats(total, duplicates, modified) {
            document.getElementById('totalCount').textContent = total;
            document.getElementById('duplicateCount').textContent = duplicates;
            document.getElementById('modifiedCount').textContent = modified;
        }

        function updateLineCounts() {
            const input = document.getElementById('input');
            const output = document.getElementById('output');
            const inputLines = input.value.trim().split('\n').filter(line => line.trim()).length;
            const outputLines = output.value.trim().split('\n').filter(line => line.trim()).length;
            
            document.getElementById('inputCount').textContent = `${inputLines} 行`;
            document.getElementById('outputCount').textContent = `${outputLines} 行`;
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.className = 'toast';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        }

        // 初始化事件监听
        document.getElementById('input').addEventListener('input', () => {
            updateLineCounts();
            const lines = document.getElementById('input').value.trim().split('\n').filter(line => line.trim());
            updateStats(lines.length, 0, 0);
        });
    </script>
</body>
</html>
